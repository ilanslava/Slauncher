name: Build FutureLauncher APK

on:
  push:
    paths:
      - "FutureLauncher_v7.zip"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: unzip -o FutureLauncher_v7.zip -d .

      - name: Compile APK
        working-directory: FutureLauncher
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FutureLauncher-APK
          path: FutureLauncher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
